<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">netEspNow v1.4 - arquitectura fractal de tres niveles</title>
  <desc id="archDesc">Un PC conectado por serial a Bridge_0, que habla ESP-NOW cifrado con Gateway_0. Gateway_0 encabeza la celula de nivel 0 con cuatro endpoints, uno de ellos endpoint-bridge hacia Gateway_1. Gateway_1 encabeza la celula de nivel 1 con nueve endpoints, uno de ellos endpoint-bridge hacia Gateway_2. Gateway_2 encabeza la celula de nivel 2 con cinco endpoints. Total 22 ESP8266.</desc>

  <defs>
    <marker id="arwBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L0,10 L0,0 z" fill="#6c8cd9"/>
    </marker>
    <marker id="arwGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L0,10 L0,0 z" fill="#d4a853"/>
    </marker>
    <marker id="arwGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L0,10 L0,0 z" fill="#4caf7d"/>
    </marker>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style><![CDATA[
      .bg      { fill: #0b0e14; }
      .panel   { fill: #131824; stroke: #26303f; stroke-width: 1.2; }
      .txt     { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c7d0e0; }
      .dim     { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7c8698; }
      .mono    { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #c7d0e0; }
      .monodim { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #7c8698; }
      .title   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; font-weight: 700; }
      .kicker  { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #6c8cd9; letter-spacing: 3px; }
      .cell0   { fill: rgba(108,140,217,0.045); stroke: #3c4a66; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .cell1   { fill: rgba(212,168,83,0.035); stroke: #6b5730; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .cell2   { fill: rgba(76,175,125,0.035); stroke: #37604c; stroke-width: 1.4; stroke-dasharray: 7 6; }
      .wire    { stroke: #6c8cd9; stroke-width: 1.6; fill: none; }
      .wireGold{ stroke: #d4a853; stroke-width: 1.6; fill: none; }
      .wireDim { stroke: #3c4a66; stroke-width: 1.2; fill: none; }
      .node    { fill: #1a2130; stroke: #3c4a66; stroke-width: 1.2; }
      .nodeGw  { fill: #223052; stroke: #6c8cd9; stroke-width: 1.6; }
      .nodeEb  { fill: #2a2416; stroke: #d4a853; stroke-width: 1.6; }
      .nodeEp  { fill: #16281f; stroke: #4caf7d; stroke-width: 1.3; }
      .lbl     { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #aeb8ca; font-size: 11px; }
      .lbldim  { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #6d7789; font-size: 9.5px; }
      .lv      { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7c8698; font-size: 10px; letter-spacing: 4px; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <rect x="0" y="0" width="1280" height="4" fill="#6c8cd9"/>

  <text class="title" x="48" y="62" font-size="27">netEspNow v1.4 &#183; arquitectura fractal</text>
  <text class="dim" x="48" y="88" font-size="13">22 ESP8266 &#183; 3 niveles &#183; una radio por nodo &#183; ruta explicita en el mensaje</text>
  <text class="mono" x="1232" y="62" font-size="12" text-anchor="end" fill="#6c8cd9">TOPOLOGIA</text>
  <text class="monodim" x="1232" y="82" font-size="10" text-anchor="end">docs/assets/architecture.svg</text>

  <!-- ===================== PC -> BRIDGE -> GW0 ===================== -->
  <g>
    <rect class="panel" x="48" y="126" width="164" height="56" rx="8"/>
    <text class="mono" x="130" y="150" font-size="12" text-anchor="middle" fill="#ffffff">PC</text>
    <text class="lbldim" x="130" y="167" font-size="9" text-anchor="middle">Python &#183; 115200 baud</text>

    <line class="wire" x1="212" y1="154" x2="266" y2="154" marker-end="url(#arwBlue)"/>

    <rect class="panel" x="272" y="126" width="176" height="56" rx="8"/>
    <text class="mono" x="360" y="150" font-size="12" text-anchor="middle" fill="#ffffff">Bridge_0</text>
    <text class="lbldim" x="360" y="167" font-size="9" text-anchor="middle">Serial &#8596; ESP-NOW &#183; ECC</text>

    <path class="wireGold" d="M360,182 L360,236 L340,236 L340,286" marker-end="url(#arwGold)"/>
    <text class="lbldim" x="366" y="232" fill="#8a7434">C1 &#183; cifrado asimetrico</text>
  </g>

  <!-- ===================== CELULA NIVEL 0 ===================== -->
  <g>
    <circle class="cell0" cx="340" cy="470" r="145"/>
    <text class="lv" x="340" y="650" text-anchor="middle">NIVEL 0</text>
    <text class="monodim" x="340" y="666" font-size="9" text-anchor="middle">6 nodos &#183; PMK_N0</text>

    <!-- Gateway_0 en el borde superior de la celda -->
    <rect class="nodeGw" x="286" y="292" width="108" height="38" rx="7" filter="url(#glow)"/>
    <text class="mono" x="340" y="310" font-size="11" text-anchor="middle" fill="#dce6ff">Gateway_0</text>
    <text class="lbldim" x="340" y="323" font-size="8" text-anchor="middle">gw_level 0</text>

    <!-- Endpoint-bridge E0.1 -->
    <rect class="nodeEb" x="424" y="378" width="86" height="38" rx="7"/>
    <text class="mono" x="467" y="396" font-size="11" text-anchor="middle" fill="#f0d79b">E0.1</text>
    <text class="lbldim" x="467" y="409" font-size="8" text-anchor="middle">endpoint-bridge</text>

    <rect class="nodeEp" x="186" y="330" width="86" height="34" rx="7"/>
    <text class="mono" x="229" y="352" font-size="11" text-anchor="middle" fill="#9fe0bd">E0.2</text>

    <rect class="nodeEp" x="150" y="420" width="86" height="34" rx="7"/>
    <text class="mono" x="193" y="442" font-size="11" text-anchor="middle" fill="#9fe0bd">E0.3</text>

    <rect class="nodeEp" x="170" y="512" width="86" height="34" rx="7"/>
    <text class="mono" x="213" y="534" font-size="11" text-anchor="middle" fill="#9fe0bd">E0.4</text>

    <path class="wireDim" d="M340,330 L340,352 L272,352"/>
    <path class="wireDim" d="M316,330 L236,420"/>
    <path class="wireDim" d="M328,330 L228,512"/>
    <path class="wire" d="M394,311 L467,378"/>
  </g>

  <!-- ===================== GW1 ===================== -->
  <g>
    <rect class="nodeGw" x="556" y="404" width="104" height="38" rx="7" filter="url(#glow)"/>
    <text class="mono" x="608" y="422" font-size="11" text-anchor="middle" fill="#dce6ff">Gateway_1</text>
    <text class="lbldim" x="608" y="435" font-size="8" text-anchor="middle">gw_level 1</text>

    <line class="wireGold" x1="510" y1="400" x2="552" y2="416" marker-end="url(#arwGold)"/>
    <text class="lbldim" x="516" y="392" font-size="8.5" fill="#8a7434">beacon</text>
  </g>

  <!-- ===================== CELULA NIVEL 1 ===================== -->
  <g>
    <circle class="cell1" cx="760" cy="470" r="155"/>
    <text class="lv" x="760" y="660" text-anchor="middle">NIVEL 1</text>
    <text class="monodim" x="760" y="676" font-size="9" text-anchor="middle">10 nodos &#183; PMK_N1</text>

    <rect class="nodeEb" x="566" y="412" width="86" height="38" rx="7"/>
    <text class="mono" x="609" y="430" font-size="11" text-anchor="middle" fill="#f0d79b">E1.1</text>
    <text class="lbldim" x="609" y="443" font-size="8" text-anchor="middle">endpoint-bridge</text>

    <line class="wire" x1="660" y1="420" x2="700" y2="356" marker-end="url(#arwBlue)"/>
    <rect class="nodeEp" x="690" y="316" width="86" height="34" rx="7"/>
    <text class="mono" x="733" y="338" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.2</text>

    <rect class="nodeEp" x="796" y="332" width="86" height="34" rx="7"/>
    <text class="mono" x="839" y="354" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.3</text>

    <rect class="nodeEp" x="872" y="404" width="86" height="34" rx="7"/>
    <text class="mono" x="915" y="426" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.4</text>

    <rect class="nodeEp" x="872" y="508" width="86" height="34" rx="7"/>
    <text class="mono" x="915" y="530" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.5</text>

    <rect class="nodeEp" x="796" y="580" width="86" height="34" rx="7"/>
    <text class="mono" x="839" y="602" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.6</text>

    <rect class="nodeEp" x="690" y="596" width="86" height="34" rx="7"/>
    <text class="mono" x="733" y="618" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.7</text>

    <rect class="nodeEp" x="590" y="548" width="86" height="34" rx="7"/>
    <text class="mono" x="633" y="570" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.8</text>

    <rect class="nodeEp" x="568" y="478" width="86" height="34" rx="7"/>
    <text class="mono" x="611" y="500" font-size="11" text-anchor="middle" fill="#9fe0bd">E1.9</text>

    <text class="lbldim" x="700" y="470" font-size="9">9 endpoints</text>
  </g>

  <!-- ===================== GW2 ===================== -->
  <g>
    <rect class="nodeGw" x="944" y="446" width="104" height="38" rx="7" filter="url(#glow)"/>
    <text class="mono" x="996" y="464" font-size="11" text-anchor="middle" fill="#dce6ff">Gateway_2</text>
    <text class="lbldim" x="996" y="477" font-size="8" text-anchor="middle">gw_level 2</text>

    <line class="wireGold" x1="922" y1="452" x2="940" y2="460" marker-end="url(#arwGold)"/>
  </g>

  <!-- ===================== CELULA NIVEL 2 ===================== -->
  <g>
    <circle class="cell2" cx="1130" cy="470" r="118"/>
    <text class="lv" x="1130" y="618" text-anchor="middle">NIVEL 2</text>
    <text class="monodim" x="1130" y="634" font-size="9" text-anchor="middle">6 nodos &#183; PMK_N2</text>

    <rect class="nodeEp" x="1030" y="412" width="82" height="32" rx="6"/>
    <text class="mono" x="1071" y="433" font-size="10.5" text-anchor="middle" fill="#9fe0bd">E2.1</text>

    <rect class="nodeEp" x="1076" y="356" width="82" height="32" rx="6"/>
    <text class="mono" x="1117" y="377" font-size="10.5" text-anchor="middle" fill="#9fe0bd">E2.2</text>

    <rect class="nodeEp" x="1162" y="366" width="82" height="32" rx="6"/>
    <text class="mono" x="1203" y="387" font-size="10.5" text-anchor="middle" fill="#9fe0bd">E2.3</text>

    <rect class="nodeEp" x="1174" y="470" width="82" height="32" rx="6"/>
    <text class="mono" x="1215" y="491" font-size="10.5" text-anchor="middle" fill="#9fe0bd">E2.4</text>

    <rect class="nodeEp" x="1104" y="536" width="82" height="32" rx="6"/>
    <text class="mono" x="1145" y="557" font-size="10.5" text-anchor="middle" fill="#9fe0bd">E2.5</text>

    <text class="lbldim" x="1130" y="470" font-size="9" text-anchor="middle">5 endpoints</text>
  </g>

  <!-- ===================== FLECHAS ENTRE NIVELES ===================== -->
  <g>
    <path class="wireGold" d="M648,442 L700,456" marker-end="url(#arwGold)"/>
    <path class="wireGold" d="M944,465 L890,480" marker-end="url(#arwGold)"/>
  </g>

  <!-- ===================== LEYENDA ===================== -->
  <g>
    <rect class="panel" x="48" y="700" width="1184" height="86" rx="10"/>
    <text class="kicker" x="68" y="726" font-size="9">LEYENDA</text>

    <circle cx="82" cy="748" r="6" fill="#223052" stroke="#6c8cd9" stroke-width="1.6"/>
    <text class="lbldim" x="96" y="752" font-size="10">Gateway (1 por celula)</text>

    <circle cx="274" cy="748" r="6" fill="#2a2416" stroke="#d4a853" stroke-width="1.6"/>
    <text class="lbldim" x="288" y="752" font-size="10">Endpoint-bridge (doble PMK)</text>

    <circle cx="500" cy="748" r="6" fill="#16281f" stroke="#4caf7d" stroke-width="1.3"/>
    <text class="lbldim" x="514" y="752" font-size="10">Endpoint simple</text>

    <line x1="676" y1="748" x2="716" y2="748" stroke="#d4a853" stroke-width="1.6"/>
    <text class="lbldim" x="724" y="752" font-size="10">Enlace cifrado (ECC o PMK)</text>

    <line x1="906" y1="748" x2="946" y2="748" stroke="#3c4a66" stroke-width="1.2" stroke-dasharray="5 4"/>
    <text class="lbldim" x="954" y="752" font-size="10">Pertenencia a celula</text>

    <text class="lbldim" x="68" y="772" font-size="9.5">Cada celula es autonoma: su gateway conoce solo a sus endpoints directos. Ningun nodo almacena una tabla de rutas global.</text>
  </g>
</svg>
