<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1000" width="1280" height="1000" role="img" aria-labelledby="rtTitle rtDesc">
  <title id="rtTitle">Ruta explicita 1:1:3 - recorrido de ida y vuelta</title>
  <desc id="rtDesc">Diagrama de secuencia que muestra como un comando del PC hacia E2.3 viaja como CMD_DOWN con ruta 1:1:3, siendo consumido un tramo por cada gateway, y como la respuesta RESP_UP vuelve por los mismos nodos hasta el PC.</desc>

  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L10,5 L0,0 z" fill="#6c8cd9"/>
    </marker>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L10,5 L0,0 z" fill="#4caf7d"/>
    </marker>
    <marker id="gd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L10,5 L0,0 z" fill="#d4a853"/>
    </marker>
    <style><![CDATA[
      .bg      { fill: #0b0e14; }
      .panel   { fill: #131824; stroke: #26303f; stroke-width: 1.2; }
      .lane    { stroke: #232b39; stroke-width: 1; stroke-dasharray: 4 6; }
      .title   { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; font-weight: 700; }
      .dim     { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #7c8698; }
      .mono    { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #c7d0e0; }
      .monodim { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #6d7789; }
      .kicker  { font-family: "JetBrains Mono", Menlo, Consolas, monospace; letter-spacing: 3px; }
      .boxLbl  { font-family: "JetBrains Mono", Menlo, Consolas, monospace; fill: #c7d0e0; font-size: 11px; }
      .note    { font-family: "JetBrains Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #98a3b6; }
      .node    { fill: #1a2130; stroke: #3c4a66; stroke-width: 1.2; }
      .nodeGw  { fill: #223052; stroke: #6c8cd9; stroke-width: 1.4; }
      .nodeEb  { fill: #2a2416; stroke: #d4a853; stroke-width: 1.4; }
      .nodeEp  { fill: #16281f; stroke: #4caf7d; stroke-width: 1.2; }
    ]]></style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="1000"/>
  <rect x="0" y="0" width="1280" height="4" fill="#6c8cd9"/>

  <text class="title" x="48" y="58" font-size="25">Ruta explicita &#183; <tspan fill="#6c8cd9">1:1:3</tspan></text>
  <text class="dim" x="48" y="84" font-size="12.5">Un comando, cinco saltos, cero tablas de rutas. Cada gateway consume un tramo y lo elimina del mensaje.</text>

  <!-- ===== BANDA IDA ===== -->
  <rect x="40" y="104" width="1200" height="500" rx="10" fill="rgba(108,140,217,0.035)" stroke="#22304a" stroke-width="1"/>
  <text class="kicker" x="60" y="130" font-size="9" fill="#6c8cd9">IDA</text>
  <text class="mono" x="100" y="130" font-size="10" fill="#6c8cd9">CMD_DOWN</text>
  <text class="monodim" x="1220" y="130" font-size="9" text-anchor="end">cada gateway consume ruta[0]</text>

  <!-- ===== BANDA VUELTA ===== -->
  <rect x="40" y="620" width="1200" height="356" rx="10" fill="rgba(76,175,125,0.03)" stroke="#1f3b2e" stroke-width="1"/>
  <text class="kicker" x="60" y="646" font-size="9" fill="#4caf7d">VUELTA</text>
  <text class="mono" x="118" y="646" font-size="10" fill="#4caf7d">RESP_UP</text>
  <text class="monodim" x="1220" y="646" font-size="9" text-anchor="end">cada nodo entrega a su padre</text>

  <!-- ===== LANES ===== -->
  <g>
    <line class="lane" x1="100" y1="158" x2="100" y2="972"/>
    <line class="lane" x1="265" y1="158" x2="265" y2="972"/>
    <line class="lane" x1="425" y1="158" x2="425" y2="972"/>
    <line class="lane" x1="575" y1="158" x2="575" y2="972"/>
    <line class="lane" x1="725" y1="158" x2="725" y2="972"/>
    <line class="lane" x1="880" y1="158" x2="880" y2="972"/>
    <line class="lane" x1="1040" y1="158" x2="1040" y2="972"/>
    <line class="lane" x1="1180" y1="158" x2="1180" y2="972"/>
  </g>

  <!-- ===== CABECERAS ===== -->
  <g>
    <rect class="panel" x="56" y="152" width="88" height="36" rx="6"/>
    <text class="boxLbl" x="100" y="175" text-anchor="middle">PC</text>

    <rect class="panel" x="203" y="152" width="124" height="36" rx="6"/>
    <text class="boxLbl" x="265" y="175" text-anchor="middle">Bridge_0</text>

    <rect class="nodeGw" x="363" y="152" width="124" height="36" rx="6"/>
    <text class="boxLbl" x="425" y="175" text-anchor="middle" fill="#dce6ff">Gateway_0</text>

    <rect class="nodeEb" x="523" y="152" width="104" height="36" rx="6"/>
    <text class="boxLbl" x="575" y="175" text-anchor="middle" fill="#f0d79b">E0.1</text>

    <rect class="nodeGw" x="663" y="152" width="124" height="36" rx="6"/>
    <text class="boxLbl" x="725" y="175" text-anchor="middle" fill="#dce6ff">Gateway_1</text>

    <rect class="nodeEb" x="828" y="152" width="104" height="36" rx="6"/>
    <text class="boxLbl" x="880" y="175" text-anchor="middle" fill="#f0d79b">E1.1</text>

    <rect class="nodeGw" x="978" y="152" width="124" height="36" rx="6"/>
    <text class="boxLbl" x="1040" y="175" text-anchor="middle" fill="#dce6ff">Gateway_2</text>

    <rect class="nodeEp" x="1136" y="152" width="88" height="36" rx="6"/>
    <text class="boxLbl" x="1180" y="175" text-anchor="middle" fill="#9fe0bd">E2.3</text>
  </g>

  <!-- ===== FLECHAS IDA ===== -->
  <g font-size="10.5">
    <line x1="138" y1="212" x2="227" y2="212" stroke="#6c8cd9" stroke-width="1.6" marker-end="url(#dn)"/>
    <text class="note" x="182" y="204" text-anchor="middle" fill="#8fa6d8">serial</text>

    <line x1="327" y1="266" x2="387" y2="266" stroke="#d4a853" stroke-width="1.6" marker-end="url(#gd)"/>
    <text class="note" x="357" y="258" text-anchor="middle" fill="#a98a45">ECC</text>

    <line x1="487" y1="320" x2="547" y2="320" stroke="#6c8cd9" stroke-width="1.6" marker-end="url(#dn)"/>
    <text class="note" x="517" y="312" text-anchor="middle" fill="#8fa6d8">consume 1</text>

    <line x1="637" y1="374" x2="697" y2="374" stroke="#d4a853" stroke-width="1.6" marker-end="url(#gd)"/>
    <text class="note" x="667" y="366" text-anchor="middle" fill="#a98a45">intacta</text>

    <line x1="787" y1="428" x2="847" y2="428" stroke="#6c8cd9" stroke-width="1.6" marker-end="url(#dn)"/>
    <text class="note" x="817" y="420" text-anchor="middle" fill="#8fa6d8">consume 1</text>

    <line x1="942" y1="482" x2="1002" y2="482" stroke="#d4a853" stroke-width="1.6" marker-end="url(#gd)"/>
    <text class="note" x="972" y="474" text-anchor="middle" fill="#a98a45">intacta</text>

    <line x1="1102" y1="536" x2="1162" y2="536" stroke="#6c8cd9" stroke-width="1.6" marker-end="url(#dn)"/>
    <text class="note" x="1132" y="528" text-anchor="middle" fill="#8fa6d8">consume 3</text>
  </g>

  <!-- ===== ETIQUETAS DE RUTA IDA ===== -->
  <g>
    <text class="mono" x="182" y="238" font-size="10" text-anchor="middle" fill="#c7d0e0">ruta = "1:1:3"</text>

    <text class="mono" x="517" y="336" font-size="10" text-anchor="middle" fill="#f0d79b">ruta = "1:3"</text>
    <text class="mono" x="817" y="444" font-size="10" text-anchor="middle" fill="#f0d79b">ruta = "3"</text>
    <text class="mono" x="1132" y="552" font-size="10" text-anchor="middle" fill="#9fe0bd">ruta = "" &#183; EJECUTA</text>
  </g>

  <!-- ===== NOTAS LATERALES IDA ===== -->
  <g>
    <text class="monodim" x="1180" y="600" font-size="9" text-anchor="end">E2.3 ya no reenvia: la ruta viene vacia, el mensaje es para el.</text>
  </g>

  <!-- ===== FLECHAS VUELTA ===== -->
  <g>
    <line x1="1162" y1="712" x2="1102" y2="712" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>
    <text class="note" x="1132" y="704" text-anchor="middle" fill="#6fbf95">val = 512</text>

    <line x1="1002" y1="762" x2="942" y2="762" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>
    <text class="note" x="972" y="754" text-anchor="middle" fill="#6fbf95">RESP_UP</text>

    <line x1="847" y1="812" x2="787" y2="812" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>

    <line x1="697" y1="862" x2="637" y2="862" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>
    <text class="note" x="667" y="854" text-anchor="middle" fill="#6fbf95">msg_id</text>

    <line x1="547" y1="912" x2="487" y2="912" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>
    <text class="note" x="517" y="904" text-anchor="middle" fill="#6fbf95">al padre</text>

    <line x1="387" y1="962" x2="327" y2="962" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>

    <line x1="227" y1="962" x2="138" y2="962" stroke="#4caf7d" stroke-width="1.6" marker-end="url(#up)"/>
    <text class="note" x="182" y="954" text-anchor="middle" fill="#6fbf95">rtt_ms</text>
  </g>

  <!-- ===== CAJA EXPLICATIVA INFERIOR ===== -->
  <rect x="840" y="306" width="380" height="180" rx="9" fill="#101725" stroke="#26303f" stroke-width="1"/>
  <text class="kicker" x="860" y="332" font-size="9" fill="#d4a853">INVARIANTE</text>
  <text class="mono" x="860" y="356" font-size="10.5" fill="#c7d0e0">El primer numero de la ruta es</text>
  <text class="mono" x="860" y="374" font-size="10.5" fill="#c7d0e0">siempre el endpoint del nivel que</text>
  <text class="mono" x="860" y="392" font-size="10.5" fill="#c7d0e0">acaba de recibir el mensaje.</text>
  <text class="monodim" x="860" y="418" font-size="9.5">Si queda un solo numero, es el destino</text>
  <text class="monodim" x="860" y="434" font-size="9.5">final de ese nivel y se entrega.</text>
  <text class="monodim" x="860" y="450" font-size="9.5">Si el numero no existe, el gateway</text>
  <text class="monodim" x="860" y="466" font-size="9.5">devuelve endpoint_not_found sin timeout.</text>
</svg>
